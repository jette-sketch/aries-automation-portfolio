<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 850" role="img" aria-labelledby="title desc">
<title id="title">ClinicFlow operational workflow</title>
<desc id="desc">A conceptual walk-in reception workflow from arrival through queueing, service, completion, and administrative follow-up if needed.</desc>
<rect width="400" height="850" rx="16" fill="#070d17"/>
<rect x="12" y="12" width="376" height="78" rx="10" fill="#0c1927" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="59" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Walk-in Arrival</text>
<path d="M200 93 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="12" y="115" width="376" height="78" rx="10" fill="#0c1927" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="162" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Reception Registration</text>
<path d="M200 196 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="12" y="218" width="376" height="78" rx="10" fill="#0c1927" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="265" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Queue Number Issued</text>
<path d="M200 299 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="12" y="321" width="376" height="78" rx="10" fill="#0c1927" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="368" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Service / Provider Routing</text>
<path d="M200 402 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="12" y="424" width="376" height="78" rx="10" fill="#0c1927" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="471" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Waiting Queue</text>
<path d="M200 505 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="12" y="527" width="376" height="78" rx="10" fill="#0c1927" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="574" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Called / In Service</text>
<path d="M200 608 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="12" y="630" width="376" height="78" rx="10" fill="#0c1927" stroke="#67e8f9" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="677" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Completed</text>
<path d="M200 711 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="12" y="733" width="376" height="78" rx="10" fill="#0c1927" stroke="#fda4af" stroke-opacity="0.65" stroke-width="2"/>
<text x="200" y="766" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">Administrative Follow-up</text>
<text x="200" y="792" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="600">if needed</text>
</svg>
